---
- name: Despliegue de Aplicacion y Reinicio Condicional
  hosts: produccion

  tasks:
    - name: 1. Inyectar configuracion de la BD
      ansible.builtin.copy:
        dest: /tmp/db_config.txt
        content: "Conexion exitosa al entorno: {{ entorno }}"

      notify: Reiniciar_Servicio_Web

  handlers:
    - name: Reiniciar_Servicio_Web
      ansible.builtin.debug:
        msg: "=== SIMULANDO REINICIO DE NGINX / APACHE ==="